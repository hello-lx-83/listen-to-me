<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen to Me</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
        background: #17130f;
        color: #f1ece4;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #17130f;
      }

      body {
        display: grid;
        place-items: center;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .mark {
        width: 48px;
        height: 48px;
      }

      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        margin: -8px 0 0;
        color: #a99f92;
        font-size: 12px;
      }

      .progress {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: #302922;
      }

      .progress::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #e9b956;
        content: "";
        animation: loading 1s ease-in-out infinite alternate;
      }

      @keyframes loading {
        from { transform: translateX(-100%); }
        to { transform: translateX(240%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <g fill="#e9b956">
            <rect x="5" y="21" width="4" height="6" rx="2" />
            <rect x="12" y="17" width="4" height="14" rx="2" />
            <rect x="19" y="12" width="4" height="24" rx="2" />
          </g>
          <g fill="#65cde3">
            <rect x="34" y="10" width="4" height="28" rx="2" />
            <rect x="30" y="10" width="12" height="4" rx="2" />
            <rect x="30" y="34" width="12" height="4" rx="2" />
          </g>
        </svg>
      </div>
      <h1>Listen to Me</h1>
      <p>正在启动…</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script>
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.__TAURI_INTERNALS__?.invoke("show_splashscreen");
        });
      });
    </script>
  </body>
</html>
